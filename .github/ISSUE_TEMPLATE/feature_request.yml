name: Feature request
description: Propose a focused improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or simpler alternatives you considered.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, security, and compatibility impact
      description: Call out any new data collection, external service, permission, migration, or breaking change.
