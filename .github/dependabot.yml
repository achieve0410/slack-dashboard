version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    allow:
      - dependency-name: django
      - dependency-name: gunicorn
      - dependency-name: slack-sdk
      - dependency-name: whitenoise
      - dependency-name: anthropic
      - dependency-name: openai
      - dependency-name: mcp
      - dependency-name: mysqlclient

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directory: /db/docker_compose
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
