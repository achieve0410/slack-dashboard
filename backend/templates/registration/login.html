<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>로그인 · Slack Dashboard</title>
  <style>
    :root {
      color: #1d2922;
      background: #eef1ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
    }
    main {
      width: min(420px, 100%);
      padding: 36px;
      border: 1px solid #d8dfda;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(22, 37, 31, 0.1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      color: #fff;
      background: #2f7459;
      font-size: 20px;
      font-weight: 700;
      place-items: center;
    }
    h1 { margin: 0; font-size: 22px; }
    .brand p, .description { margin: 4px 0 0; color: #69766e; font-size: 13px; }
    form { display: grid; gap: 16px; }
    label { display: grid; gap: 7px; font-size: 13px; font-weight: 700; }
    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cdd6d0;
      border-radius: 9px;
      font: inherit;
    }
    input:focus { outline: 2px solid #8ab09f; outline-offset: 1px; }
    button {
      min-height: 46px;
      margin-top: 4px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: #174c39;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .error {
      padding: 11px 12px;
      border-radius: 8px;
      color: #8b332d;
      background: #f8e4e1;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="mark" aria-hidden="true">S</div>
      <div>
        <h1>Slack Dashboard</h1>
        <p>Owner workspace</p>
      </div>
    </div>
    <p class="description">대시보드에 접근하려면 소유자 계정으로 로그인하세요.</p>
    {% if form.errors %}
      <p class="error" role="alert">아이디 또는 비밀번호를 확인해주세요.</p>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label>
        사용자 이름
        {{ form.username }}
      </label>
      <label>
        비밀번호
        {{ form.password }}
      </label>
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
