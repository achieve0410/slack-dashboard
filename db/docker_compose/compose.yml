services:
  mysql:
    image: mysql:8.4.10
    container_name: slack_dashboard_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:13307:3306"
    env_file:
      - ../slack_dashboard_db/.env
    environment:
      TZ: ${TZ:-UTC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ../slack_dashboard_db/data:/var/lib/mysql
      - ../slack_dashboard_db/config/my.cnf:/etc/mysql/conf.d/slack-dashboard.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
